---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
spec:
  chartRef:
    kind: OCIRepository
    name: kured
  interval: 1h
  values:
    fullnameOverride: kured
    extraEnvVars:
      - name: KURED_NOTIFY_URL
        valueFrom:
          secretKeyRef:
            name: kured-secret
            key: KURED_NOTIFY_URL
    configuration:
      lockTtl: 10m
      lockReleaseDelay: 5m
