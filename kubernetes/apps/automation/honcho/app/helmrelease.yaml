---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app honcho
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      honcho:
        strategy: RollingUpdate
        annotations: &annotations
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - deriver
                      - key: app.kubernetes.io/instance
                        operator: In
                        values:
                          - "{{ .Release.Name }}"
                  topologyKey: kubernetes.io/hostname
        initContainers: &initContainers
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: honcho-secret
            env:
              - name: INIT_POSTGRES_HOST
                value: tolstoy-rw.database.svc.cluster.local
              - name: INIT_POSTGRES_PORT
                value: "5432"
              - name: INIT_POSTGRES_DBNAME
                valueFrom:
                  secretKeyRef:
                    name: honcho-secret
                    key: HONCHO_DBNAME
              - name: INIT_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: honcho-secret
                    key: HONCHO_DB_USER
              - name: INIT_POSTGRES_PASS
                valueFrom:
                  secretKeyRef:
                    name: honcho-secret
                    key: HONCHO_DB_PASS
              - name: INIT_POSTGRES_SUPER_USER
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_USER
              - name: INIT_POSTGRES_SUPER_PASS
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_PASS
          02-init-extensions:
            image:
              repository: postgres
              tag: "18"
            env:
              - name: PGHOST
                value: tolstoy-rw.database.svc.cluster.local
              - name: PGPORT
                value: "5432"
              - name: PGDATABASE
                valueFrom:
                  secretKeyRef:
                    name: honcho-secret
                    key: HONCHO_DBNAME
              - name: PGUSER
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_USER
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: POSTGRES_SUPER_PASS
            command:
              - bash
              - -lc
              - psql -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS
                vector;"
          03-database-migration:
            image: &image
              repository: ghcr.io/plastic-labs/honcho
              tag: v3.0.11@sha256:383edb2bd63af7c78cdc875a058d98ab5757cef4bc3f7a8b102148e2db89b3c6
            envFrom: &envFrom
              - secretRef:
                  name: honcho-secret
            env: &env
              - name: DB_CONNECTION_URI
                value: postgresql+psycopg://$(HONCHO_DB_USER):$(HONCHO_DB_PASS)@tolstoy-rw.database.svc.cluster.local:5432/$(HONCHO_DBNAME)
              - name: LLM_OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: OPENAI_API_KEY
              - name: LLM_ANTHROPIC_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: ANTHROPIC_API_KEY
            command:
              - python
              - scripts/provision_db.py
        containers:
          app:
            image: *image
            envFrom: *envFrom
            env: *env
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources: &resources
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
      honcho-dashboard:
        strategy: RollingUpdate
        annotations: *annotations
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            image:
              repository: ghcr.io/tolkonepiu/honcho-dashboard
              tag: v0.5.11@sha256:656ed537ea4fabf500486408e3c887cafc78cf73a14c076d9d3fe51dbf29c592
            env:
              - name: HONCHO_BASE_URL
                value: http://honcho-app.automation.svc.cluster.local:8000
            securityContext: *securityContext
            resources: *resources
      deriver:
        strategy: RollingUpdate
        replicas: 1
        annotations: *annotations
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - honcho
                      - key: app.kubernetes.io/instance
                        operator: In
                        values:
                          - "{{ .Release.Name }}"
                  topologyKey: kubernetes.io/hostname
        initContainers: *initContainers
        containers:
          app:
            image: *image
            command:
              - python
              - -m
              - src.deriver
            envFrom: *envFrom
            env: *env
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: *securityContext
            resources: *resources
    service:
      app:
        type: ClusterIP
        controller: *app
        ports:
          http:
            port: *port
      dashboard:
        type: ClusterIP
        controller: honcho-dashboard
        ports:
          http:
            port: 3000
      deriver:
        type: ClusterIP
        controller: deriver
        ports:
          metrics:
            port: 9090
    serviceMonitor:
      app:
        enabled: true
        serviceName: honcho-app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
      deriver:
        enabled: true
        serviceName: honcho-deriver
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      config-file:
        type: configMap
        name: honcho-configmap
        globalMounts:
          - path: /app/config.toml
            subPath: config.toml
            readOnly: true
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.popov.wtf"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /v3
            backendRefs:
              - identifier: app
                port: *port
          - backendRefs:
              - identifier: dashboard
                port: 3000
