---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp-server
spec:
  chartRef:
    kind: OCIRepository
    name: kubernetes-mcp-server
  interval: 1h
  values:
    image:
      registry: ghcr.io
      repository: containers/kubernetes-mcp-server
      # renovate: datasource=docker depName=ghcr.io/containers/kubernetes-mcp-server
      version: v0.0.62
    service:
      type: ClusterIP
    ingress:
      enabled: false
    metrics:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    rbac:
      extraClusterRoleBindings:
        - name: view
          roleRef:
            name: view
            external: true
    config:
      port: "{{ .Values.service.port }}"
      read_only: true
      stateless: true
      validation_enabled: true
      toolsets:
        - core
        - helm
      server_instructions: |
        Use this server for read-only Kubernetes troubleshooting in this homelab cluster.
        Prefer it for listing resources, inspecting workloads, reading pod logs,
        checking events, and viewing Helm releases in the current cluster.
