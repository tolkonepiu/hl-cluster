---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mcp-victoriametrics
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  dependsOn:
    - name: victoria-metrics
      namespace: observability
  values:
    controllers:
      mcp-victoriametrics:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/victoriametrics/mcp-victoriametrics
              tag: v1.20.2@sha256:bcbf84f945d6efb03fb8b2d2ccc3294420dccdc0b445752dce96f02619416dfe
            env:
              MCP_DISABLED_TOOLS: documentation,export,flags,metric_relabel_debug,downsampling_filters_debug,retention_filters_debug,test_rules
              MCP_LISTEN_ADDR: 0.0.0.0:8080
              MCP_LOG_FORMAT: json
              MCP_SERVER_MODE: http
              VM_INSTANCE_ENTRYPOINT: http://vmsingle-stack.observability.svc.cluster.local:8428
              VM_INSTANCE_TYPE: single
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        type: ClusterIP
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
            path: /metrics
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.popov.wtf"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
