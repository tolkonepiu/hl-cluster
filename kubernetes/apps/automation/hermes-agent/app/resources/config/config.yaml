---
model:
  default: gpt-5.5
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
terminal:
  backend: local
dashboard:
  theme: cyberpunk
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: honcho
cron:
  wrap_response: false
telegram:
  require_mention: true
  mention_patterns:
    - "кестрел"
    - "kestrel"
  reply_to_mode: true
  reactions: false
  gateway_restart_notification: false
display:
  platforms:
    telegram:
      tool_progress: "off"
      cleanup_progress: true
      runtime_footer:
        enabled: false
mcp_servers:
  kubernetes-mcp-server:
    url: http://kubernetes-mcp-server.automation.svc.cluster.local:8080/mcp
  mcp-victoriametrics:
    url: http://mcp-victoriametrics.automation.svc.cluster.local:8080/mcp
  flux-operator-mcp:
    url: http://flux-operator-mcp.automation.svc.cluster.local:9090/mcp
