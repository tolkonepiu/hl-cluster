---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: hermes-agent-configmap
    files:
      - config.yaml=./resources/config/config.yaml
      - honcho.json=./resources/config/honcho.json
generatorOptions:
  disableNameSuffixHash: true
