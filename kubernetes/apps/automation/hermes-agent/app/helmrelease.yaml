---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes-agent
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      hermes-agent:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-copy-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - /bin/sh
              - -ec
              - |
                cp -f /config-source/config.yaml /opt/data/config.yaml
                cp -f /config-source/honcho.json /opt/data/honcho.json
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.16@sha256:f8f548d87d16634d1ad9e3777280f3f577ba2358703f04e18e74007ffd3621bf
            args:
              - gateway
              - run
            envFrom:
              - secretRef:
                  name: hermes-agent-secret
            env:
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_CORS_ORIGINS: "*"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HONCHO_BASE_URL: http://honcho-app.automation.svc.cluster.local:8000
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: GITHUB_TOKEN
            probes:
              liveness: &gatewayProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &gatewayPort 8642
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *gatewayProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *gatewayPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    persistence:
      config-file:
        type: configMap
        name: hermes-agent-configmap
        globalMounts:
          - path: /config-source
            readOnly: true
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /opt/data
    service:
      app:
        controller: *app
        ports:
          gateway:
            port: *gatewayPort
          dashboard:
            port: *dashboardPort
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.popov.wtf"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /v1
              - path:
                  type: PathPrefix
                  value: /health
            backendRefs:
              - identifier: app
                port: *gatewayPort
          - backendRefs:
              - identifier: app
                port: *dashboardPort
