---
# yaml-language-server: $schema=https://raw.githubusercontent.com/openclaw-rocks/openclaw-operator/main/bundle/manifests/openclaw.rocks_openclawinstances.yaml
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
spec:
  image:
    repository: ghcr.io/tolkonepiu/openclaw-full
    # renovate: datasource=docker depName=ghcr.io/tolkonepiu/openclaw-full
    tag: v2026.5.12@sha256:9b47fadec0a075dc90a35dff58355d85e006e54babaf6f9f52b6ed4a3c554322
  envFrom:
    - secretRef:
        name: openclaw-secret
  env:
    - name: OPENCLAW_SKIP_CHANNELS
      value: "1"
    - name: OPENCLAW_SKIP_GMAIL_WATCHER
      value: "1"
    - name: OPENCLAW_SKIP_CANVAS_HOST
      value: "1"
    - name: OPENCLAW_LOAD_SHELL_ENV
      value: "1"
    - name: OPENCLAW_HOOKS_TOKEN
      valueFrom:
        secretKeyRef:
          name: cluster-secrets
          key: OPENCLAW_HOOKS_TOKEN
    - name: PUSHOVER_USER_KEY
      valueFrom:
        secretKeyRef:
          name: cluster-secrets
          key: PUSHOVER_USER_KEY
    - name: NODE_OPTIONS
      value: "--max-old-space-size=512"
  storage:
    persistence:
      enabled: true
      storageClass: openebs-hostpath
      size: 10Gi
      accessModes:
        - ReadWriteOnce
      orphan: false
  resources:
    requests:
      cpu: "100m"
      memory: "640Mi"
    limits:
      memory: "1024Mi"
  availability:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
  security:
    networkPolicy:
      enabled: false
  observability:
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
      prometheusRule:
        enabled: false
      grafanaDashboard:
        enabled: false
  probes:
    startup:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    liveness:
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
  selfConfigure:
    enabled: false
  gateway:
    controlUiOrigins:
      - "https://openclaw.popov.wtf"
    existingSecret: openclaw-gateway-token
  skills:
    - "@digitallyborn/pushover-notify"
    # renovate: datasource=github-tags depName=fluxcd/agent-skills
    - "pack:fluxcd/agent-skills/skills/gitops-cluster-debug@v0.0.3"
    # renovate: datasource=github-tags depName=JuliusBrussee/caveman
    - "pack:JuliusBrussee/caveman/skills/caveman@v1.8.2"
  plugins:
    - "@honcho-ai/openclaw-honcho@1.5.0"
    - "@martian-engineering/lossless-claw@0.9.4"
  workspace:
    bootstrap:
      enabled: false
    configMapRef:
      name: openclaw-context-config
  extraVolumes:
    - name: hooks-transforms
      configMap:
        name: openclaw-transforms-config
  extraVolumeMounts:
    - name: hooks-transforms
      mountPath: /home/openclaw/.openclaw/hooks/transforms
      readOnly: true
  config:
    mergeMode: overwrite
    raw:
      gateway:
        reload:
          mode: "off"
      secrets:
        providers:
          default:
            source: env
      agents:
        defaults:
          maxConcurrent: 2
          params:
            cacheRetention: "long"
          model:
            primary: openai/gpt-5.4
            fallbacks:
              - openai/gpt-5.4-mini
              - openai/gpt-5.4-nano
          subagents:
            maxConcurrent: 3
            model: openai/gpt-5.4-mini
          models:
            openai/gpt-5.4:
              alias: reasoning
              params:
                cacheRetention: long
            openai/gpt-5.4-mini:
              alias: worker
              params:
                cacheRetention: long
          contextPruning:
            mode: cache-ttl
            ttl: 1h
            keepLastAssistants: 3
          contextInjection: continuation-skip
          skipBootstrap: true
          heartbeat:
            every: 0m
            model: openai/gpt-5.4-nano
            session: main
            target: none
            lightContext: true
            isolatedSession: true
        list:
          - id: kestrel
            default: true
            identity:
              name: Kestrel
              emoji: 🤖
      skills:
        load:
          watch: false
        install:
          nodeManager: npm
        allowBundled:
          - clawhub
          - gh-issues
          - github
          - healthcheck
          - session-logs
          - skill-creator
          - taskflow-inbox-triage
          - taskflow
          - weather
        entries:
          gh-issues:
            enabled: true
            apiKey:
              source: env
              provider: default
              id: GH_TOKEN
          github:
            enabled: true
            env:
              GH_TOKEN: ${GH_TOKEN}
      tools:
        exec:
          host: gateway
          security: full
          ask: "off"
          strictInlineEval: false
        web:
          search:
            provider: exa
      plugins:
        enabled: true
        allow:
          - exa
          - lossless-claw
          - openclaw-honcho
        deny:
          - amazon-bedrock
          - amazon-bedrock-mantle
          - anthropic
          - anthropic-vertex
          - byteplus
          - chutes
          - cloudflare-ai-gateway
          - comfy
          - copilot-proxy
          - deepseek
          - fal
          - fireworks
          - github-copilot
          - google
          - huggingface
          - kilocode
          - kimi
          - litellm
          - microsoft-foundry
          - minimax
          - mistral
          - moonshot
          - nvidia
          - ollama
          - opencode
          - opencode-go
          - qianfan
          - qwen
          - sglang
          - stepfun
          - synthetic
          - together
          - venice
          - vercel-ai-gateway
          - vllm
          - volcengine
          - vydra
          - xai
          - xiaomi
          - zai
        slots:
          memory: openclaw-honcho
          contextEngine: lossless-claw
        entries:
          openclaw-honcho:
            enabled: true
            hooks:
              allowConversationAccess: true
            config:
              baseUrl: http://honcho-app.automation.svc.cluster.local:8000
              workspaceId: openclaw
              noisePatterns:
                - "/^Read HEARTBEAT\\.md if it exists/s"
                - "/^You are an autonomous LCM retrieval navigator\\./s"
                - "/^\\{\"answer\":/s"
          lossless-claw:
            enabled: true
            subagent:
              allowModelOverride: true
              allowedModels:
                - openai/gpt-5.4-mini
            config:
              contextThreshold: 0.75
              freshTailCount: 64
              newSessionRetainDepth: 2
              leafMinFanout: 8
              condensedMinFanout: 4
              condensedMinFanoutHard: 2
              incrementalMaxDepth: 1
              leafChunkTokens: 20000
              leafTargetTokens: 2400
              condensedTargetTokens: 2000
              maxExpandTokens: 4000
              largeFileThresholdTokens: 25000
              summaryModel: openai/gpt-5.4-mini
              expansionModel: openai/gpt-5.4-mini
              delegationTimeoutMs: 300000
              summaryTimeoutMs: 60000
              cacheAwareCompaction:
                enabled: true
              dynamicLeafChunkTokens:
                enabled: true
                max: 40000
              transcriptGcEnabled: false
              proactiveThresholdCompactionMode: deferred
              pruneHeartbeatOk: false
              ignoreSessionPatterns:
                - agent:*:cron:**
              statelessSessionPatterns:
                - agent:*:subagent:**
              skipStatelessSessions: true
      cron:
        enabled: true
        maxConcurrentRuns: 1
        retry:
          maxAttempts: 3
          backoffMs: [60000, 120000, 300000]
          retryOn: ["rate_limit", "overloaded", "network", "server_error"]
        sessionRetention: "24h"
        runLog:
          maxBytes: "2mb"
          keepLines: 2000
      session:
        scope: per-sender
        reset:
          mode: idle
          idleMinutes: 10080 # 7 days
        maintenance:
          mode: "enforce"
          pruneAfter: "30d"
          maxEntries: 500
          rotateBytes: "100mb"
          resetArchiveRetention: "30d"
      update:
        checkOnStart: false
        auto:
          enabled: false
      cli:
        banner:
          taglineMode: "off"
      canvasHost:
        enabled: false
      discovery:
        mdns:
          mode: "off"
        wideArea:
          enabled: false
      acp:
        enabled: false
      mcp:
        servers:
          github-mcp-server:
            transport: streamable-http
            url: https://api.githubcopilot.com/mcp/
            headers:
              Authorization: Bearer ${GH_TOKEN}
            connectionTimeoutMs: 30000
          kubernetes-mcp:
            transport: streamable-http
            url: http://kubernetes-mcp-server.automation.svc.cluster.local:8080/mcp
            connectionTimeoutMs: 30000
          victoria-metrics-mcp:
            transport: streamable-http
            url: http://mcp-victoriametrics.automation.svc.cluster.local:8080/mcp
            connectionTimeoutMs: 30000
          flux-mcp:
            transport: streamable-http
            url: http://flux-operator-mcp.automation.svc.cluster.local:9090/mcp
            connectionTimeoutMs: 30000
      hooks:
        enabled: true
        token: ${OPENCLAW_HOOKS_TOKEN}
        path: /hooks
        allowRequestSessionKey: false
        transformsDir: /home/openclaw/.openclaw/hooks/transforms
        mappings:
          - id: alertmanager
            match:
              path: alertmanager
            action: wake
            wakeMode: now
            transform:
              module: alertmanager.mjs
            allowUnsafeExternalContent: true
