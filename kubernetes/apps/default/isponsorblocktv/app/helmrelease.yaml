---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: isponsorblocktv
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      isponsorblocktv:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        initContainers:
          01-wait-for-youtube:
            image:
              repository: ghcr.io/dmunozv04/isponsorblocktv
              tag: v2.9.0@sha256:5b8cfa805cb60b99a9e83a2df62d41c63865a315f7ee7cfed1a78052d93650b6
            command:
              - python3
              - -c
              - |
                import time
                import urllib.request

                url = "https://www.youtube.com/generate_204"

                for attempt in range(1, 11):
                    try:
                        with urllib.request.urlopen(url, timeout=10) as response:
                            if response.status == 204:
                                print(f"YouTube is ready on attempt {attempt}")
                                raise SystemExit(0)

                            print(f"Unexpected YouTube status {response.status} on attempt {attempt}")
                    except Exception as error:
                        print(f"YouTube is not ready on attempt {attempt}: {type(error).__name__}: {error}")

                    time.sleep(10)

                raise SystemExit("YouTube did not become ready")
        containers:
          app:
            image:
              repository: ghcr.io/dmunozv04/isponsorblocktv
              tag: v2.9.0@sha256:5b8cfa805cb60b99a9e83a2df62d41c63865a315f7ee7cfed1a78052d93650b6
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    persistence:
      config:
        type: secret
        name: isponsorblocktv-config
        globalMounts:
          - path: /app/data
            readOnly: true
