---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Update devenv.lock"

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * 2 # Runs at 00:00 on Tuesday UTC

jobs:
  update-devenv-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: tolkonepiu
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Run devenv update
        run: |
          devenv update
          devenv test || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            devenv.lock
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-devenv-lock
          title: "feat(devenv)!: Update devenv.lock"
          body: |
            Automated update of devenv.lock file.

            This PR was automatically created by the scheduled workflow.
          commit-message: "feat(devenv)!: Update devenv.lock"
          delete-branch: true
          labels: |
            area/devenv
